<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FluxDrop</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
  <!-- QR code and Socket.io -->
  <script src="/socket.io/socket.io.js"></script>
  <script src="https://cdn.rawgit.com/davidshimjs/qrcodejs/gh-pages/qrcode.min.js"></script>
</head>
<body>
  <div class="container">
    <h1>FluxDrop</h1>
    <p class="sub">Share files & notes instantly between devices. No login.</p>

    <!-- 🆕 Mobile Link Section -->
    <div class="card" style="margin-bottom: 16px;">
      <h3>📱 Mobile Link</h3>
      <div id="mobileLink" class="muted">Fetching…</div>
      <button id="copyMobileBtn">Copy Mobile Link</button>
    </div>

    <div id="setup">
      <button id="createRoomBtn">Create New Link</button>
      <div class="join">
        <input id="roomInput" placeholder="Enter code (e.g., A1b2C3)" />
        <button id="joinBtn">Join</button>
      </div>
    </div>

    <div id="room" class="hidden">
      <div class="row">
        <div class="card">
          <h3>Room</h3>
          <div class="roomline">
            <span id="roomId"></span>
            <button id="copyBtn">Copy Link</button>
          </div>

          <!-- QR container -->
          <div id="qrcanvas" style="width:160px;height:160px;"></div>

          <p class="muted">Scan on your phone to open this room.</p>
          <p class="muted" id="expiry"></p>
          <div id="countdown" class="muted"></div>
        </div>

        <div class="card">
          <h3>Share Text</h3>
          <textarea id="textArea" rows="6" placeholder="Type or paste text here"></textarea>

	  <!-- Copy button clearly below -->
	  <button id="copyTextBtn" style="margin-top:8px;">📋 Copy Text</button>


          <!-- New Status Line with Dot -->
          <div style="margin-top:8px; display:flex; align-items:center; gap:6px;">
            <span id="syncDot" style="width:10px;height:10px;border-radius:50%;background:gray;display:inline-block;"></span>
            <span id="syncStatus" class="muted">Not synced yet</span>
          </div>
        </div>

        <div class="card">
          <h3>Share File</h3>
          <input id="fileInput" type="file" />
          <button id="uploadBtn">Upload</button>
          <div id="files"></div>
        </div>
      </div>
    </div>

    <footer>
      <span class="muted">Files auto-delete after 60 minutes. Do not upload sensitive data.</span>
    </footer>
  </div>

  <!-- toast container -->
  <div id="toast" style="position:fixed;right:16px;bottom:16px;z-index:9999;pointer-events:none;"></div>

  <script src="main.js"></script>
</body>
</html>
